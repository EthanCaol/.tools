; 语音输入(Qwen3-ASR 版)配置
; 修改后重启 启动.bat 生效。

[hotkey]
; 按住说话的热键。使用 AutoHotkey v2 键名。
; 注意:旧项目 whisper-typing 若同时在运行,两边的听写脚本会抢同一个热键,
; 必须先停掉一个。停旧项目用它的托盘「退出」。
key=RControl

[model]
; Qwen3-ASR 模型。本机实测(RTX 4070 Ti SUPER,bf16,35 秒音频):
;   Qwen3-ASR-1.7B-hf   2.63s   中文 7/9,英文关键检查点全对   ← 当前选择
;   Qwen3-ASR-0.6B-hf   2.78s   速度几乎相同,英文多错一处
; 两个模型都已下载到本地缓存,改这一行即可切换,不需要重新下载。
name=Qwen/Qwen3-ASR-1.7B-hf
; auto = 有可用 GPU 就用 GPU,否则退回 CPU;也可直接填 cuda / cpu
device=auto
; 热词/上下文提示,留空表示不用。
; 实测有效:把「陈晨」放进词表后,识别结果从「晨晨」变成「陈晨」。
; 内容是一段自由文本,建议把常说的专名和英文术语都列进去,例如:
;   Vocabulary: 陈晨，李楠，Transformer，attention，baseline，accuracy.
prompt=
; 单次生成的最大 token 数。中文一个字约 1 个 token,256 足够长的句子。
max_new_tokens=256
; 静态 KV cache。实测把生成从 28.7ms/token 降到 9.8ms/token,约 2.7 倍。
; 原理:默认的 KV cache 每步都在变长,CUDA graph 无法使用,内核启动开销占了大头;
;       静态 cache 预分配固定长度,形状固定,于是能走编译路径。
; 代价:需要 triton-windows 包(Windows 没有官方 Triton),且启动时要用两个
;       不同长度预热一次(约 15 秒)吃掉编译开销。预热失败会自动回退,服务不受影响。
static_cache=true

[server]
; 端口不能和旧项目(8756)相同,否则两个服务会抢同一个端口。
host=127.0.0.1
port=8757

[typing]
; 逐字插入时,每个字符之间的间隔毫秒数。个别程序丢字时调大,想更快可调到 0。
char_delay_ms=8

[log]
; 是否把每次识别出的全文写进 logs\transcripts.log。
; 用途是积累一段时间后统计词频,挑出常说的专名和英文术语填进上面的 prompt。
; 一行一条,制表符分隔:时间、音频时长、转写耗时、文本。
; 注意这是把你说过的每句话都落盘,其中可能有私人内容,文件只在本机 logs\ 下。
; 不想记就改成 false,或直接删掉 logs\transcripts.log。
save_text=true

[capture]
; 录音设备。留空 = 用系统默认输入设备。
; 也可填设备索引或设备名的片段。设备列表查询命令见 README。
device=
; 采样率。16000 是 Qwen3-ASR 要求的采样率,不要改。
sample_rate=16000
; 短于此时长的录音直接丢弃,用于过滤误触
min_duration_ms=300
; 录音时长上限,防止忘记松手。超过后自动停止并转写
max_duration_ms=120000
; 是否裁掉首尾静音。Qwen3-ASR 对静音输出空字符串,不裁剪也不会出现幻觉,
; 裁剪只是为了少喂音频、省一点算力。
trim_silence=true
; 裁剪用的能量门限(dBFS)。30ms 帧的均方根低于此值算静音。
trim_threshold_dbfs=-45
; 裁剪时在有效语音前后各保留的余量毫秒数。留太少会切掉字头字尾。
trim_margin_ms=300
